services:
  - type: web
    name: transaction-webhook-service
    runtime: docker
    plan: free
    # Keep this in the same region as the database (Neon: AWS Asia Pacific, Singapore).
    # A cross-region database adds ~500ms to every request.
    region: singapore
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false   # set the Neon connection string in the Render dashboard
      - key: PROCESSING_DELAY_SECONDS
        value: "30"
      - key: WORKER_CONCURRENCY
        value: "50"
